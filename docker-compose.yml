version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: srijan_postgres
    environment:
      POSTGRES_USER: srijan
      POSTGRES_PASSWORD: srijan
      POSTGRES_DB: srijan
    ports:
      - "5432:5432"
    volumes:
      - srijan_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: srijan_redis
    ports:
      - "6379:6379"

volumes:
  srijan_postgres_data:
