services:
  postgres:
    image: postgres:16
    container_name: srijan_postgres
    environment:
      POSTGRES_USER: srijan
      POSTGRES_PASSWORD: srijan
      POSTGRES_DB: srijan
    ports:
      - "${SRIJAN_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - srijan_postgres_data:/var/lib/postgresql/data
      # Applied in filename order on first startup only (empty data volume).
      # After pulling new migrations, either apply them manually with psql or
      # reset with `docker compose down -v`.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srijan -d srijan"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: srijan_redis
    ports:
      - "${SRIJAN_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  webhook-server:
    build: .
    container_name: srijan_webhook_server
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://srijan:srijan@postgres:5432/srijan
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${SRIJAN_API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: srijan_worker
    command: celery -A src.workers.celery_app worker -Q dev-queue,debug-queue --loglevel=info
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://srijan:srijan@postgres:5432/srijan
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  srijan_postgres_data:
